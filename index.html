var K='aitrade-dashboard-pw';
function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
async function open(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.salt),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.iv)},key,u8(P.data)));
  document.open();document.write(html);document.close();
}
var saved=null;try{saved=localStorage.getItem(K);}catch(e){}
if(saved)open(saved).catch(function(){try{localStorage.removeItem(K);}catch(e){}});
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();var pw=document.getElementById('pw').value,rem=document.getElementById('rem').checked,err=document.getElementById('err');err.textContent='פותח...';
  // Remember before the page is replaced by the dashboard.
  open(pw).then(function(){try{if(rem)localStorage.setItem(K,pw);}catch(e){}})
    .catch(function(){err.textContent='סיסמה שגויה';});
});
